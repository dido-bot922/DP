<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Descola Perdizes</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏫</text></svg>" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ============ TELA DE LOGIN ============ -->
  <div id="login-screen" class="hidden">
    <div class="login-card">
      <div class="login-logo">🏫</div>
      <h1>Descola <span>Perdizes</span></h1>
      <p class="login-tagline">O lugar da nossa escola.<br>Só entra quem é de verdade da casa — <strong>@alunopueri.com.br</strong>.</p>
      <a class="btn-google" href="/auth/google">
        <svg width="20" height="20" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
        Entrar com o Google
      </a>
      <p class="login-error hidden" id="login-error">Você tentou entrar com uma conta que não é da escola.<br>Use seu e-mail <strong>@alunopueri.com.br</strong>.</p>
      <p class="login-foot">Descola Perdizes · feito pela <strong>RTechLabs</strong></p>
    </div>
  </div>

  <!-- ============ APP ============ -->
  <div id="app" class="hidden">

    <!-- Trilho de servidores -->
    <nav id="rail">
      <button class="rail-home" id="btn-home" title="Início (DMs)" aria-label="Início">🏠</button>
      <div class="rail-divider"></div>
      <div id="server-rail"></div>
      <div class="rail-divider"></div>
      <button class="rail-add" id="btn-add-server" title="Criar servidor" aria-label="Criar servidor">＋</button>
      <div class="rail-spacer"></div>
      <button class="rail-user" id="btn-user" title="Minha conta"></button>
    </nav>

    <!-- Coluna lateral -->
    <aside id="sidebar">
      <header id="sidebar-header"></header>
      <div id="sidebar-body"></div>
      <footer id="sidebar-footer"></footer>
    </aside>

    <!-- Área principal -->
    <main id="main">
      <header id="chat-header"></header>
      <div id="messages"></div>
      <div id="typing-bar"></div>
      <div id="input-wrap">
        <button id="btn-attach" title="Anexar imagem/arquivo">📎</button>
        <input type="file" id="file-input" accept="image/*,.pdf,.txt,.csv,.md" hidden />
        <textarea id="msg-input" rows="1" placeholder="Mensagem para #geral" maxlength="4000"></textarea>
        <button id="btn-send" title="Enviar">➤</button>
      </div>
    </main>

    <!-- Membros -->
    <aside id="members-panel"></aside>

  </div>

  <!-- ============ MODAIS ============ -->
  <div id="modal-overlay" class="hidden">
    <div id="modal"></div>
  </div>

  <div id="toast" class="hidden"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js"></script>
</body>
</html>
